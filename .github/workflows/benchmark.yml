name: Benchmark render
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q project.zip -d work
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: work/package-lock.json
      - name: System libraries for headless Chrome and video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - run: npm ci
        working-directory: work
      - name: Render benchmark (real template frames, software WebGL)
        run: node scripts/benchmark.mjs
        working-directory: work
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: work/out/
